<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · Sri Balaji</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2393e2c3'/%3E%3Cstop offset='1' stop-color='%230f7a55'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='system-ui,sans-serif' font-size='28' font-weight='700' fill='%2304130d' text-anchor='middle'%3ESB%3C/text%3E%3C/svg%3E">
  <script>
    // Same theme as the portfolio: saved choice, else follow the OS.
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    :root, [data-theme="light"] {
      --bg: #f5f7f4; --surface: #ffffff; --text: #141a16; --muted: #4d554f; --faint: #5f6862;
      --border: #e0e6e0; --accent: #0f7a55; --accent-ink: #ffffff; --glow: rgb(15 122 85 / 0.16); --err: #b42318;
    }
    [data-theme="dark"] {
      --bg: #0b0c0e; --surface: #131418; --text: #eeeae2; --muted: #aba69c; --faint: #918c82;
      --border: #25262b; --accent: #5cc9a0; --accent-ink: #04130d; --glow: rgb(92 201 160 / 0.22); --err: #f97066;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 16px;
      background: radial-gradient(60% 50% at 50% 0%, var(--glow), transparent 70%), var(--bg);
      color: var(--text); font-family: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    }
    main { width: min(560px, 100%); }
    .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: clamp(5rem, 22vw, 9rem); font-weight: 700; letter-spacing: -0.06em; line-height: 0.9; margin: 0;
      background: linear-gradient(180deg, var(--text) 30%, color-mix(in srgb, var(--text) 25%, var(--bg))); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { margin: 18px 0 10px; font-size: clamp(1.5rem, 5vw, 2rem); letter-spacing: -0.03em; }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
    .term { margin: 28px 0; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); overflow: hidden; }
    .term-bar { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .term-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
    pre { margin: 0; padding: 16px 18px; font: 0.82rem/1.75 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-all; color: var(--muted); }
    .ps { color: var(--accent); }
    .err { color: var(--err); }
    .cursor { display: inline-block; width: 0.55em; height: 1.1em; vertical-align: -0.2em; background: var(--accent); animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    a.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: 0.95rem; text-decoration: none;
      border: 1px solid var(--border); color: var(--text); background: var(--surface); }
    a.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
    a.btn:hover { transform: translateY(-1px); }
    a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>This page isn’t deployed.</h1>
    <p>The link may be old or mistyped. Everything lives on the main page.</p>
    <div class="term" aria-hidden="true">
      <div class="term-bar"><i></i><i></i><i></i></div>
      <pre><span class="ps">$</span> kubectl get page <span id="path">/missing</span>
<span class="err">Error from server (NotFound):</span> page not found
<span class="ps">$</span> kubectl rollout undo page <span class="cursor"></span></pre>
    </div>
    <div class="actions">
      <a class="btn primary" id="home" href="/sribalaji-portfolio/">Back to the portfolio →</a>
      <a class="btn" id="contact" href="/sribalaji-portfolio/#contact">Contact</a>
    </div>
  </main>
  <script>
    // GitHub Pages serves this for any missing path under the site, so links are built from the site root.
    (function () {
      var base = /\.github\.io$/.test(location.hostname) ? "/sribalaji-portfolio/" : "/";
      document.getElementById("home").href = base;
      document.getElementById("contact").href = base + "#contact";
      var p = location.pathname.replace(/^\/sribalaji-portfolio/, "") || "/";
      document.getElementById("path").textContent = p.length > 48 ? p.slice(0, 47) + "…" : p;
    })();
  </script>
</body>
</html>
